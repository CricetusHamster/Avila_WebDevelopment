<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div id="choices">
        <button onclick="startGame('Rock')">✊</button>
        <button onclick="startGame('Paper')">✋</button>
        <button onclick="startGame('Scissors')">✌️</button>
    </div>
    <div id="playerDisplay">Player:</div>
    <div id="computerDisplay">Computer:</div>
    <div id="resultDisplay">Result:</div>
    <div id="playerScore">Player Score: 0</div>
    <div id="computerScore">Computer Score: 0</div>
    <script src="script.js"></script>
</body>
</html>
